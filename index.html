<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  
  <meta name="color-scheme" content="light dark" />


  <script>
    (() => {
      const d = document.documentElement;
      const meta = document.querySelector('meta[name="color-scheme"]');
      const stored = () => {
        try {
          const t = localStorage.theme;
          return t === "dark" || t === "light" ? t : null;
        } catch {
          return null;
        }
      };
      const m = matchMedia("(prefers-color-scheme: dark)");
      const swap = () => {
        d.dataset.theme = stored() ?? (m.matches ? "dark" : "light");
      };
      const syncMeta = () => {
        meta.content = d.dataset.theme;
      };
      swap();
      syncMeta();
      m.addEventListener("change", () => {
        if (stored()) return;
        if (document.startViewTransition) document.startViewTransition(swap);
        else swap();
      });
      new MutationObserver(syncMeta).observe(d, {
        attributes: true,
        attributeFilter: ["data-theme"],
      });
    })();
  </script>

  <!-- Self-hosted; preloads start the fetches off the document itself, so none
       waits for the stylesheet that names it. crossorigin even though they are
       same-origin: fonts fetch in CORS mode, and a preload whose mode does not
       match is a second download rather than a hit. -->
  <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>

  <title>Victor Pierozan — Backend and Systems Engineer</title>
  <meta name="description"
    content="Victor Pierozan is a backend and systems engineer in Berlin, technical lead at Noah Labs, building cardiac medical devices." />
  <meta name="author" content="Victor Elízio Pierozan" />
  <link rel="canonical" href="https://victor.pierozan.com/" />

  <!-- Unfurls are built without running JS, so everything they read has to be
       static in this document. -->
  <meta property="og:type" content="profile" />
  <meta property="og:site_name" content="Victor Pierozan" />
  <meta property="og:title" content="Victor Pierozan — Backend and Systems Engineer" />
  <meta property="og:description"
    content="Victor Pierozan is a backend and systems engineer in Berlin, technical lead at Noah Labs, building cardiac medical devices." />
  <meta property="og:url" content="https://victor.pierozan.com/" />
  <meta property="og:locale" content="en_US" />
  <meta property="profile:first_name" content="Victor" />
  <meta property="profile:last_name" content="Pierozan" />

  <!-- Structured data is derived from the CV document and injected here by
       scripts/prerender.js, which throws if this marker is missing — so there
       is no path where the page ships structured data that has drifted from
       the content. `vite dev` has no prerender step and so no JSON-LD; use
       `pnpm build && pnpm preview` to check rich results. -->
  <!--ld+json-->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
